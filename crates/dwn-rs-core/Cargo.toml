[package]
name = "dwn-rs-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Core library components for dwn-rs"

[lib]
crate-type = ["rlib"]

[features]
test-utils = []

[dependencies]
xtra = { version = "0.6.0", features = ["tokio", "sink", "instrumentation"] }
chrono = { version = "0.4.30", features = ["serde"] }
cid = { version = "0.11.1", features = ["serde"] }
futures-util = "0.3.30"
simple-dns = "0.12.0"
ipld-core = { version = "0.4.1", features = ["serde"] }
serde = { version = "1.0.183", features = ["derive"] }
serde_ipld_dagcbor = "0.7.0"
serde_repr = "0.1.17"
serde_with = "3.4.0"
tokio = { version = "1.39.2", features = [
    "io-util",
    "rt",
    "rt-multi-thread",
    "net",
    "macros",
    "sync",
] }
axum = { version = "0.8.8", default-features = false, features = [
    "json",
    "http1",
    "tokio",
    "ws",
] }
tower = { version = "0.5.2", default-features = false }
derive_more = { version = "2.1", features = ["display", "from", "try_into"] }
ssi-dids-core = "0.3.1"
base64 = "0.23.1"
ssi-jwk = { version = "0.4.0", default-features = false, features = [
    "secp256r1",
    "secp256k1",
    "ed25519",
] }
ssi-jws = { version = "0.5.0", default-features = false, features = [
    "secp256r1",
    "secp256k1",
    "ed25519",
] }
ulid = { version = "3.0.0", features = ["serde"] }
url = { version = "2.5.0", features = ["serde"] }
percent-encoding = "2.3.2"
thiserror = "2.0.3"
serde_json = "1.0.113"
tracing = "0.1.40"
bytes = "1.8.0"
rand = "0.10.2"
partially = { version = "0.2.1", features = ["derive"] }
multihash = { version = "0.19.1", features = ["serde"] }
multihash-codetable = { version = "0.2.2", features = ["serde", "sha2"] }
dwn-rs-message-derive = { path = "../dwn-rs-message-derive" }
ssi-claims-core = { version = "0.2.0", default-features = false }
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdh"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
aes = "0.9.3"
aes-gcm = "0.11.1"
bip39 = { version = "2.0.0", features = ["rand"] }
hmac = "0.13.0"
jsonschema = { version = "0.53.0", default-features = false }
multibase = "0.9.2"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "brotli",
    "deflate",
    "gzip",
    "json",
    "rustls",
] }
z32 = "1.3.0"

[dev-dependencies]
tokio = { version = "1.39.2", features = ["test-util"] }
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
dwn-rs-stores = { path = "../dwn-rs-stores", features = ["sqlite"] }
