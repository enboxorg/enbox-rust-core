[package]
name = "did-dht"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "did:dht method codec, BEP44 framing, and Pkarr gateway client"

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
serde = { version = "1.0.183", features = ["derive"] }
serde_json = "1.0.113"
simple-dns = "0.12.0"
ssi-dids-core = "0.3.1"
ssi-jwk = { version = "0.4.0", default-features = false, features = [
    "secp256r1",
    "secp256k1",
    "ed25519",
] }
thiserror = "2.0.3"
url = { version = "2.5.0", features = ["serde"] }
z32 = "1.3.0"

[dev-dependencies]
tokio = { version = "1.39.2", features = ["macros", "rt", "rt-multi-thread"] }
