[package]
name = "dwn-rs-agent"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Agent runtime for Enbox: identity, vault, registration and legacy connect helpers"

[lib]
crate-type = ["rlib"]

[features]
default = ["sqlite"]
sqlite = ["dep:dwn-rs-stores", "dep:rusqlite", "dwn-rs-stores/sqlite"]

[dependencies]
dwn-rs-core = { path = "../dwn-rs-core", default-features = false }
did-dht = { path = "../did-dht" }
dwn-rs-stores = { path = "../dwn-rs-stores", optional = true }
rusqlite = { version = "0.39", optional = true }
base64 = "0.23.1"
bip39 = { version = "2.0.0", features = ["rand"] }
chrono = { version = "0.4.30", features = ["serde"] }
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.183", features = ["derive"] }
serde_json = "1.0.113"
thiserror = "2.0.3"
sha2 = "0.11.0"
ssi-dids-core = "0.3.1"
ssi-jwk = { version = "0.4.0", default-features = false, features = ["secp256r1", "secp256k1", "ed25519"] }
ulid = { version = "3.0.0", features = ["serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
z32 = "1.3.0"

[dev-dependencies]
tokio = { version = "1.39.2", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3.10"
dwn-rs-stores = { path = "../dwn-rs-stores" }
